name: "Install node_modules"
description: "Auto-detects package manager (npm, yarn, or bun) and installs dependencies with caching."

inputs:
  NPM_TOKEN:
    description: "Token for private GitHub Packages registry"
    required: true
  branch:
    description: "Git ref to checkout. Leave empty to skip checkout."
    required: false
    default: ""
  package-manager:
    description: "Force package manager: npm, yarn, bun, or auto (detect from lock file)"
    required: false
    default: "auto"
  node-version-file:
    description: "File to read node version from. Leave empty to auto-detect."
    required: false
    default: ""
  bun-version-file:
    description: "File to read bun version from. Leave empty to auto-detect."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Checkout
      uses: actions/checkout@v6
      if: ${{ inputs.branch != '' }}
      with:
        ref: ${{ inputs.branch }}

    - name: Detect package manager
      id: detect
      shell: bash
      env:
        FORCED: ${{ inputs.package-manager }}
      run: |
        if [ "$FORCED" != "auto" ]; then
          manager="$FORCED"
        elif [ -f bun.lockb ] || [ -f bun.lock ]; then
          manager=bun
        elif [ -f yarn.lock ]; then
          manager=yarn
        elif [ -f package-lock.json ]; then
          manager=npm
        else
          echo "::error::No lock file found. Set package-manager input or add a lock file."
          exit 1
        fi
        echo "manager=$manager" >> "$GITHUB_OUTPUT"

    # Precedence: input, then mise config, then legacy file. The grep guard is
    # required because setup-node and setup-bun both fail on a .tool-versions
    # that does not declare their tool.
    - name: Resolve version files
      id: versions
      shell: bash
      env:
        MANAGER: ${{ steps.detect.outputs.manager }}
        NODE_INPUT: ${{ inputs.node-version-file }}
        BUN_INPUT: ${{ inputs.bun-version-file }}
      run: |
        declares() { [ -f .tool-versions ] && grep -qE "^[[:space:]]*$1[[:space:]]" .tool-versions; }

        if [ -n "$NODE_INPUT" ]; then
          node_file="$NODE_INPUT"
        elif declares 'node(js)?'; then
          node_file=.tool-versions
        elif [ -f mise.toml ]; then
          node_file=mise.toml
        elif [ -f .mise.toml ]; then
          node_file=.mise.toml
        elif [ -f .config/mise/config.toml ]; then
          node_file=.config/mise/config.toml
        else
          node_file=.nvmrc
        fi
        echo "node-file=$node_file" >> "$GITHUB_OUTPUT"

        # Bun is gated on the detected manager so yarn/npm repos with a
        # node-only .tool-versions never reach the error below.
        [ "$MANAGER" = bun ] || exit 0

        # setup-bun cannot read mise.toml.
        if [ -n "$BUN_INPUT" ]; then
          bun_file="$BUN_INPUT"
        elif declares bun; then
          bun_file=.tool-versions
        elif [ -f .bun-version ]; then
          bun_file=.bun-version
        else
          echo "::error::No bun version file. Add a bun line to .tool-versions or set bun-version-file."
          exit 1
        fi
        echo "bun-file=$bun_file" >> "$GITHUB_OUTPUT"

    - name: Setup Node
      uses: actions/setup-node@v6
      if: ${{ steps.detect.outputs.manager != 'bun' }}
      with:
        node-version-file: ${{ steps.versions.outputs.node-file }}
        cache: ${{ steps.detect.outputs.manager }}
        registry-url: "https://npm.pkg.github.com/"
        scope: "@sfstudios"

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      if: ${{ steps.detect.outputs.manager == 'bun' }}
      with:
        bun-version-file: ${{ steps.versions.outputs.bun-file }}

    # Tools like tsc and eslint still expect node on PATH.
    - name: Setup Node (for Bun projects)
      uses: actions/setup-node@v6
      if: ${{ steps.detect.outputs.manager == 'bun' }}
      with:
        node-version-file: ${{ steps.versions.outputs.node-file }}

    # Bun reads .npmrc natively and repos already carry the registry URL there,
    # so only the auth token is appended.
    - name: Configure registry auth (bun)
      if: ${{ steps.detect.outputs.manager == 'bun' }}
      shell: bash
      env:
        NPM_TOKEN: ${{ inputs.NPM_TOKEN }}
      run: echo "//npm.pkg.github.com/:_authToken=${NPM_TOKEN}" >> .npmrc

    - name: Install dependencies
      shell: bash
      env:
        MANAGER: ${{ steps.detect.outputs.manager }}
        NODE_AUTH_TOKEN: ${{ inputs.NPM_TOKEN }}
        NPM_TOKEN: ${{ inputs.NPM_TOKEN }}
      run: |
        case "$MANAGER" in
          npm)  npm ci ;;
          yarn) yarn install --frozen-lockfile ;;
          bun)  bun install --frozen-lockfile ;;
        esac
